<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello from Minecraft Giraffe!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #2b3a42;
      --card-bg: #1e262c;
      --border-color: #4f6367;
      --accent-color: #f7b733;
      --accent-hover: #ffc952;
      --grass-green: #5b8c38;
      --grass-green-light: #7cb342;
      --dirt-brown: #866043;
      --dirt-dark: #5c4028;
      --text-main: #f0f4f8;
      --text-sub: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #3a506b 0%, #1c2541 70%, #0b132b 100%);
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: rgba(30, 38, 44, 0.94);
      border: 4px solid #4f6367;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 2px #263238;
      border-radius: 12px;
      padding: 36px 28px;
      text-align: center;
      backdrop-filter: blur(8px);
      position: relative;
    }

    .minecraft-badge {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #111;
      background: var(--accent-color);
      padding: 8px 14px;
      border: 2px solid #000;
      box-shadow: 3px 3px 0 #000;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #333;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-sub);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .hint-bubble {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #f7b733;
      background: rgba(0, 0, 0, 0.4);
      border: 2px dashed #f7b733;
      padding: 6px 14px;
      border-radius: 4px;
      margin-bottom: 18px;
      animation: pulse-hint 2s infinite ease-in-out;
    }

    @keyframes pulse-hint {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
    }

    /* Picture Frame & Giraffe */
    .image-frame {
      position: relative;
      background: #111;
      padding: 10px;
      border: 4px solid #3e2723;
      box-shadow: 6px 6px 0 #000;
      border-radius: 4px;
      margin: 0 auto 0;
      max-width: 520px;
      overflow: hidden;
      cursor: pointer;
    }

    .image-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid #5d4037;
      pointer-events: none;
      z-index: 2;
    }

    .giraffe-img-wrapper {
      position: relative;
      overflow: hidden;
      display: block;
      border-radius: 2px;
    }

    .giraffe-img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: filter 0.15s ease;
      transform-origin: 50% 80%;
    }

    .image-frame:hover .giraffe-img {
      filter: brightness(1.05);
    }

    /* Munching Animation */
    .munching {
      animation: giraffe-munch 0.5s ease-in-out;
    }

    @keyframes giraffe-munch {
      0% { transform: translateY(0) scale(1) rotate(0deg); }
      25% { transform: translateY(14px) scale(0.96, 1.04) rotate(-3deg); }
      50% { transform: translateY(6px) scale(1.03, 0.97) rotate(2deg); }
      75% { transform: translateY(10px) scale(0.98, 1.02) rotate(-1deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }

    /* Floating Nom & Particle Container */
    .particle-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .floating-crumb {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: #5b8c38;
      border: 1px solid #2e4a19;
      box-shadow: 1px 1px 0 #000;
      border-radius: 1px;
      animation: float-crumb 0.7s forwards ease-out;
    }

    @keyframes float-crumb {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0.4) rotate(var(--rot));
        opacity: 0;
      }
    }

    .floating-text {
      position: absolute;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #ffe066;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #333;
      animation: float-up 0.9s forwards ease-out;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes float-up {
      0% {
        transform: translate(-50%, 0) scale(0.8);
        opacity: 0;
      }
      20% {
        transform: translate(-50%, -10px) scale(1.2);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -45px) scale(1);
        opacity: 0;
      }
    }

    /* Grass Blocks Bar */
    .grass-lawn-container {
      max-width: 520px;
      margin: 0 auto 24px;
      background: #1e130c;
      padding: 6px;
      border: 4px solid #3e2723;
      border-top: none;
      box-shadow: 6px 6px 0 #000;
      border-radius: 0 0 4px 4px;
    }

    .grass-lawn-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: #bcaaa4;
    }

    .lawn-blocks {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      background: #0d0805;
      padding: 6px;
      border: 2px solid #27170e;
    }

    /* Individual Block */
    .block {
      aspect-ratio: 1 / 1;
      position: relative;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.15), inset -2px -2px 0 rgba(0, 0, 0, 0.4);
      transition: transform 0.1s, filter 0.2s;
    }

    .block:hover {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }

    .block:active {
      transform: translateY(1px);
    }

    /* Grass Block: lush green top with pixel serrations */
    .block.grass {
      background:
        linear-gradient(180deg,
          #6fa33c 0%, #5b8c38 35%,
          #4a752c 36%, #4a752c 45%,
          #866043 46%, #6e4c32 100%
        );
      border: 2px solid #3d2616;
      box-shadow: 0 -2px 0 #7cb342, inset 1px 1px 0 #8bc34a, inset -1px -1px 0 #2e4a19;
    }

    .block.grass::after {
      content: "";
      position: absolute;
      top: -3px;
      left: 2px;
      right: 2px;
      height: 4px;
      background: repeating-linear-gradient(90deg, #7cb342 0, #7cb342 4px, transparent 4px, transparent 8px);
      pointer-events: none;
    }

    /* Dirt Block: grass eaten! */
    .block.dirt {
      background:
        radial-gradient(circle at 30% 40%, #755337 2px, transparent 3px),
        radial-gradient(circle at 75% 70%, #543922 2px, transparent 3px),
        linear-gradient(180deg, #6e4c32 0%, #543922 100%);
      border: 2px solid #2c1a0e;
      box-shadow: inset 1px 1px 0 #8d6443, inset -1px -1px 0 #2c1a0e;
      animation: dirt-shake 0.3s ease;
    }

    @keyframes dirt-shake {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(3px); }
      70% { transform: translateY(-1px); }
    }

    /* Regrowing Pulse */
    .block.regrowing {
      position: relative;
    }

    .block.regrowing::before {
      content: "🌱";
      font-size: 10px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: sprout-pop 0.6s ease-out;
    }

    @keyframes sprout-pop {
      0% { transform: translate(-50%, 0) scale(0); opacity: 0; }
      50% { transform: translate(-50%, -60%) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    }

    /* Buttons */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 13px 18px;
      color: #fff;
      background-color: var(--grass-green);
      border: 2px solid #1e380c;
      box-shadow: 0 4px 0 #1e380c, 0 6px 0 #000;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: #6da644;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1e380c, 0 8px 0 #000;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #1e380c, 0 2px 0 #000;
    }

    .btn-secondary {
      background-color: #8d6443;
      border-color: #4e321e;
      box-shadow: 0 4px 0 #4e321e, 0 6px 0 #000;
    }

    .btn-secondary:hover {
      background-color: #a1744f;
      box-shadow: 0 6px 0 #4e321e, 0 8px 0 #000;
    }

    .btn-secondary:active {
      box-shadow: 0 0 0 #4e321e, 0 2px 0 #000;
    }

    /* Status Log */
    .status-text {
      margin-top: 18px;
      min-height: 24px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #a5d6a7;
      text-shadow: 1px 1px 0 #000;
      transition: opacity 0.3s;
    }

    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="minecraft-badge">Biome: Savanna</div>
    <h1>Hello, World! 👋</h1>
    <p class="subtitle">Welcome to my new GitHub-hosted website! Meet our voxel savanna giraffe:</p>

    <div class="hint-bubble">
      <span>👉 Click the giraffe to feed it grass! 🌿</span>
    </div>

    <!-- Giraffe Picture Frame -->
    <div class="image-frame" id="giraffeCard" title="Click me to eat grass!">
      <div class="giraffe-img-wrapper">
        <img src="giraffe.png" alt="A blocky giraffe in Minecraft voxel art style" class="giraffe-img" id="giraffeImage" />
        <div class="particle-layer" id="particleLayer"></div>
      </div>
    </div>

    <!-- Grass Lawn Bar -->
    <div class="grass-lawn-container">
      <div class="grass-lawn-header">
        <span>SAVANNA LAWN</span>
        <span id="grassCounter">10 / 10 GRASS</span>
      </div>
      <div class="lawn-blocks" id="lawnBlocks" title="Click any grass block to feed it directly!">
        <!-- 10 Grass blocks rendered via JS -->
      </div>
    </div>

    <div class="status-text" id="statusMessage">🦒 The giraffe is looking at you curiously...</div>

    <div class="button-group">
      <button class="btn" id="feedBtn" onclick="feedGiraffe()">Feed Grass 🌿</button>
      <button class="btn btn-secondary" onclick="sayHello()">Say Hello Back! 💬</button>
    </div>
  </main>

  <footer>
    Hosted with GitHub Pages • Crafted in Minecraft Style
  </footer>

  <script>
    // Audio synthesis for Minecraft sound effects (No external audio files needed!)
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Minecraft-style crunchy eating sound
    function playCrunchSound() {
      try {
        const ctx = getAudioContext();
        const duration = 0.18;
        const bufferSize = ctx.sampleRate * duration;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(650 + Math.random() * 300, ctx.currentTime);
        filter.Q.setValueAtTime(2.5, ctx.currentTime);

        const gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(0.35, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(ctx.destination);

        noise.start();
      } catch (e) {
        // Audio might be blocked before first interaction
      }
    }

    // Minecraft-style gentle regrow / sprout chime
    function playRegrowSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        const randomNote = notes[Math.floor(Math.random() * notes.length)];

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(randomNote, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(randomNote * 1.25, ctx.currentTime + 0.18);

        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.22);
      } catch (e) {
        // Silent fallback
      }
    }

    // Grass Lawn Management
    const TOTAL_BLOCKS = 10;
    const REGROW_DELAY_MS = 3200; // 3.2 seconds to regrow
    const blocksState = Array(TOTAL_BLOCKS).fill('grass'); // 'grass', 'dirt'
    const blockTimers = Array(TOTAL_BLOCKS).fill(null);

    const lawnElement = document.getElementById('lawnBlocks');
    const grassCounter = document.getElementById('grassCounter');
    const statusMessage = document.getElementById('statusMessage');
    const giraffeImage = document.getElementById('giraffeImage');
    const giraffeCard = document.getElementById('giraffeCard');
    const particleLayer = document.getElementById('particleLayer');

    // Initialize lawn blocks
    function initLawn() {
      lawnElement.innerHTML = '';
      for (let i = 0; i < TOTAL_BLOCKS; i++) {
        const b = document.createElement('div');
        b.className = 'block grass';
        b.dataset.index = i;
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          eatSpecificBlock(i);
        });
        lawnElement.appendChild(b);
      }
      updateCounter();
    }

    function updateCounter() {
      const grassCount = blocksState.filter(s => s === 'grass').length;
      grassCounter.textContent = `${grassCount} / ${TOTAL_BLOCKS} GRASS`;
    }

    function setStatus(msg) {
      statusMessage.textContent = msg;
    }

    // Spawn floating Minecraft particles
    function spawnEatingParticles() {
      const texts = ['*CRUNCH*', '*NOM*', '*MUNCH*', '✨ YUM!'];
      const text = texts[Math.floor(Math.random() * texts.length)];

      const floatEl = document.createElement('div');
      floatEl.className = 'floating-text';
      floatEl.textContent = text;
      floatEl.style.left = '50%';
      floatEl.style.top = '65%';
      particleLayer.appendChild(floatEl);

      setTimeout(() => floatEl.remove(), 900);

      // Crumb pixels
      for (let i = 0; i < 9; i++) {
        const crumb = document.createElement('div');
        crumb.className = 'floating-crumb';
        crumb.style.left = `${45 + (Math.random() * 15)}%`;
        crumb.style.top = `${68 + (Math.random() * 10)}%`;

        const tx = (Math.random() - 0.5) * 110 + 'px';
        const ty = (Math.random() * -65 - 15) + 'px';
        const rot = (Math.random() * 360) + 'deg';

        crumb.style.setProperty('--tx', tx);
        crumb.style.setProperty('--ty', ty);
        crumb.style.setProperty('--rot', rot);

        particleLayer.appendChild(crumb);
        setTimeout(() => crumb.remove(), 700);
      }
    }

    // Feed giraffe handler
    function feedGiraffe() {
      // Find available green grass blocks
      const grassIndices = [];
      blocksState.forEach((state, idx) => {
        if (state === 'grass') grassIndices.push(idx);
      });

      if (grassIndices.length === 0) {
        setStatus("🦒 All grass eaten! The giraffe is waiting for it to regrow...");
        // Happy shake
        giraffeImage.classList.add('munching');
        setTimeout(() => giraffeImage.classList.remove('munching'), 500);
        return;
      }

      // Pick a random grass block to eat
      const chosenIndex = grassIndices[Math.floor(Math.random() * grassIndices.length)];
      eatSpecificBlock(chosenIndex);
    }

    function eatSpecificBlock(index) {
      if (blocksState[index] !== 'grass') {
        setStatus("🌱 That dirt block is already regrowing its grass!");
        return;
      }

      // Play munch animation & sound
      giraffeImage.classList.remove('munching');
      void giraffeImage.offsetWidth; // trigger reflow
      giraffeImage.classList.add('munching');
      playCrunchSound();
      spawnEatingParticles();

      // Eat block: change state to dirt
      blocksState[index] = 'dirt';
      const blockEl = lawnElement.children[index];
      blockEl.className = 'block dirt';
      updateCounter();

      const munchLines = [
        "🌿 *Crunch!* The giraffe took a big bite of sweet grass!",
        "🦒 *Munch munch!* Savanna grass tastes delicious!",
        "✨ *Nom!* Block eaten! Fresh blades will regrow soon."
      ];
      setStatus(munchLines[Math.floor(Math.random() * munchLines.length)]);

      // Schedule Regrowth
      if (blockTimers[index]) clearTimeout(blockTimers[index]);
      blockTimers[index] = setTimeout(() => {
        regrowBlock(index);
      }, REGROW_DELAY_MS + (Math.random() * 1500)); // slightly randomized regrowth for natural feel
    }

    function regrowBlock(index) {
      if (blocksState[index] === 'grass') return;

      const blockEl = lawnElement.children[index];
      blockEl.classList.add('regrowing');

      setTimeout(() => {
        blocksState[index] = 'grass';
        blockEl.className = 'block grass';
        playRegrowSound();
        updateCounter();

        // Check if all grass is now restored
        const grassCount = blocksState.filter(s => s === 'grass').length;
        if (grassCount === TOTAL_BLOCKS) {
          setStatus("✨ All the savanna grass has fully regrown! Fresh & green!");
        } else {
          setStatus("🌱 A fresh patch of grass has regrown on the lawn!");
        }
      }, 350);
    }

    // Clicking the giraffe card feeds the giraffe
    giraffeCard.addEventListener('click', () => {
      feedGiraffe();
    });

    // Friendly messages for "Say Hello Back!"
    function sayHello() {
      const messages = [
        "🦒 The giraffe nudged you gently with its blocky snout!",
        "✨ *Voxel noises* Hello, adventurer!",
        "🌿 The giraffe happily munches on an acacia leaf block!",
        "👋 Welcome to the blocky world!"
      ];
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      alert(randomMsg);
    }

    // Init lawn on load
    initLawn();
  </script>
</body>
</html>
