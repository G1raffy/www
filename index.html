<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello from Minecraft Giraffe!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #2b3a42;
      --card-bg: #1e262c;
      --border-color: #4f6367;
      --accent-color: #f7b733;
      --accent-hover: #ffc952;
      --grass-green: #5b8c38;
      --dirt-brown: #866043;
      --text-main: #f0f4f8;
      --text-sub: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #3a506b 0%, #1c2541 70%, #0b132b 100%);
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: rgba(30, 38, 44, 0.92);
      border: 4px solid #4f6367;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 2px #263238;
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
      backdrop-filter: blur(8px);
      position: relative;
    }

    .minecraft-badge {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #111;
      background: var(--accent-color);
      padding: 8px 14px;
      border: 2px solid #000;
      box-shadow: 3px 3px 0 #000;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #333;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--text-sub);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .image-frame {
      position: relative;
      background: #111;
      padding: 10px;
      border: 4px solid #3e2723;
      box-shadow: 6px 6px 0 #000;
      border-radius: 4px;
      margin: 0 auto 28px;
      max-width: 520px;
      overflow: hidden;
    }

    .image-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid #5d4037;
      pointer-events: none;
    }

    .giraffe-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transition: transform 0.3s ease;
    }

    .giraffe-img:hover {
      transform: scale(1.02);
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 14px 20px;
      color: #fff;
      background-color: var(--grass-green);
      border: 2px solid #1e380c;
      box-shadow: 0 4px 0 #1e380c, 0 6px 0 #000;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.1s;
      display: inline-block;
    }

    .btn:hover {
      background-color: #6da644;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1e380c, 0 8px 0 #000;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #1e380c, 0 2px 0 #000;
    }

    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="minecraft-badge">Biome: Savanna</div>
    <h1>Hello, World! 👋</h1>
    <p class="subtitle">Welcome to my new GitHub-hosted website! Meet our voxel savanna friend:</p>

    <div class="image-frame">
      <img src="giraffe.png" alt="A blocky giraffe in Minecraft voxel art style" class="giraffe-img" id="giraffeImage" />
    </div>

    <div class="button-group">
      <button class="btn" onclick="sayHello()">Say Hello Back!</button>
    </div>
  </main>

  <footer>
    Hosted with GitHub Pages • Crafted in Minecraft Style
  </footer>

  <script>
    function sayHello() {
      const messages = [
        "🦒 The giraffe nudged you gently with its blocky snout!",
        "✨ *Voxel noises* Hello, adventurer!",
        "🌿 The giraffe happily munches on an acacia leaf block!",
        "👋 Welcome to the blocky world!"
      ];
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      alert(randomMsg);
    }
  </script>
</body>
</html>
